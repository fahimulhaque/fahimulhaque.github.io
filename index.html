<!DOCTYPE html>
<html>
<head>
  <title>Redirecting...</title>
  <meta http-equiv="refresh" content="4;url=https://fahimulhaque.org">
  
  <style>
    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }

    .container {
      text-align: center;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
      background-color: #fff;
    }

    h1 {
      font-size: 2.5rem; /* Adjusted slightly */
      margin-bottom: 20px;
      color: #333;
    }

    .loader {
      width: 80px;
      height: 80px;
      border: 10px solid #f3f3f3;
      border-top: 10px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite; /* Faster spin for urgency */
      margin: auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    p {
      margin-top: 20px;
      color: #666;
    }

    a {
      color: #3498db;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Redirecting</h1>
    <div class="loader"></div>
    <p>We're moving you to <strong>fahimulhaque.org</strong>.</p>
    <p><small>Not redirecting? <a href="https://fahimulhaque.org">Click here</a>.</small></p>
  </div>

  <script>
    // Redirect after 3 seconds
    setTimeout(function() {
      window.location.href = "https://fahimulhaque.org";
    }, 3000);
  </script>
</body>
</html>
